<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Car Data Prediction</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>
    <h1>F1 Car Data Prediction</h1>

    <div>
        <label for="driverNumber">Driver Number:</label>
        <input type="number" id="driverNumber" value="55">

        <label for="sessionKey">Session Key:</label>
        <input type="number" id="sessionKey" value="9159">

        <label for="minSpeed">Minimum Speed (km/h):</label>
        <input type="number" id="minSpeed" value="315">

        <button id="fetchData">Fetch Data</button>
    </div>

    <div>
        <h2>Car Data</h2>
        <pre id="carData"></pre>
    </div>

    <div>
        <h2>Predictions</h2>
        <canvas id="chart"></canvas>
    </div>

    <script type="module" src="../src/app.js"></script>
</body>
</html>
